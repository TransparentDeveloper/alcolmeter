name: 리팩터링
description: 동작은 그대로 두고 구조를 바꾸는 작업
labels: ["type:refactor"]
body:
  - type: textarea
    id: what
    attributes:
      label: 바꿀 것
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 이유
      description: 왜 바꾸는지, 지금 구조의 문제
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 파일·커밋
      description: 관련 문서, 소스 경로, 커밋 해시. 없으면 `없음`
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 결정할 것
      description: 작업 전에 정해야 하는 것. 없으면 `없음`
    validations:
      required: true
