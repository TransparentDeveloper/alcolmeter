name: 블로그 주제
description: 블로그 글로 쓸 주제나 아이디어
labels: ["blog/topic"]
body:
  - type: markdown
    attributes:
      value: 제목은 "라거와 에일의 차이"처럼 명사형으로 쓴다. 글의 범위, 관점, 질문 목록은 강의 시작 때 사용자가 정한다. 여기 적지 않는다.
  - type: textarea
    id: question
    attributes:
      label: 궁금한 점
      description: 이 주제에서 궁금한 것
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 계기
      description: 주제가 떠오른 상황. 없으면 `없음`
    validations:
      required: true
