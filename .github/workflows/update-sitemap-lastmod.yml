name: Update sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/routes/**/*.svelte'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute lastmod dates
        id: dates
        run: |
          echo "home=$(git log --format='%ad' --date=short -1 -- apps/web/src/routes/+page.svelte)" >> $GITHUB_OUTPUT
          echo "makgeolli=$(git log --format='%ad' --date=short -1 -- apps/web/src/routes/makgeolli/+page.svelte)" >> $GITHUB_OUTPUT
          echo "faq=$(git log --format='%ad' --date=short -1 -- apps/web/src/routes/faq/+page.svelte)" >> $GITHUB_OUTPUT

      - name: Update sitemap.xml
        run: |
          node -e "
            const fs = require('fs');
            let xml = fs.readFileSync('apps/web/static/sitemap.xml', 'utf8');
            xml = xml.replace(/(<loc>https:\/\/alcolmeter\.vercel\.app\/<\/loc>\s*<lastmod>)[^<]+(<\/lastmod>)/, '\$1${{ steps.dates.outputs.home }}\$2');
            xml = xml.replace(/(<loc>https:\/\/alcolmeter\.vercel\.app\/makgeolli<\/loc>\s*<lastmod>)[^<]+(<\/lastmod>)/, '\$1${{ steps.dates.outputs.makgeolli }}\$2');
            xml = xml.replace(/(<loc>https:\/\/alcolmeter\.vercel\.app\/faq<\/loc>\s*<lastmod>)[^<]+(<\/lastmod>)/, '\$1${{ steps.dates.outputs.faq }}\$2');
            fs.writeFileSync('apps/web/static/sitemap.xml', xml);
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git add apps/web/static/sitemap.xml
          git commit -m "chore: web 사이트맵 lastmod 갱신 [skip ci]"
          git push
