name: Update sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update all lastmod to today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          node -e "
            const fs = require('fs');
            let xml = fs.readFileSync('apps/web/static/sitemap.xml', 'utf8');
            xml = xml.replace(/(<lastmod>)[^<]+(<\/lastmod>)/g, '\$1${TODAY}\$2');
            fs.writeFileSync('apps/web/static/sitemap.xml', xml);
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git add apps/web/static/sitemap.xml
          git commit -m "chore: web 사이트맵 lastmod 갱신 [skip ci]"
          git push
