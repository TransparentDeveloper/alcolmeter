name: Release

# 태그 push 시 GitHub Release 자동 생성.
# 태그 형식: {서브프로젝트}-v{SemVer} (예: web-v0.5.0, domain-v2-v0.1.0)
# 태그 prefix 로 서브프로젝트를 식별해, 그 서브프로젝트 CHANGELOG.md 의
# 해당 버전 섹션을 Release 본문으로 사용한다.
on:
  push:
    tags:
      - '*-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve subproject, version, CHANGELOG path
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::태그 형식이 {서브프로젝트}-v{SemVer} 가 아닙니다: $TAG"
            exit 1
          fi
          SUB="${BASH_REMATCH[1]}"
          VER="${BASH_REMATCH[2]}"
          case "$SUB" in
            web)           CHANGELOG="apps/web/CHANGELOG.md" ;;
            extension)     CHANGELOG="apps/extension/CHANGELOG.md" ;;
            domain)        CHANGELOG="packages/domain/CHANGELOG.md" ;;
            domain-v2)     CHANGELOG="packages/domain-v2/CHANGELOG.md" ;;
            design-system) CHANGELOG="packages/design-system/CHANGELOG.md" ;;
            *) echo "::error::알 수 없는 서브프로젝트: $SUB"; exit 1 ;;
          esac
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        env:
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::CHANGELOG 파일이 없습니다: $CHANGELOG"
            exit 1
          fi
          # "## [VER]" 줄부터 다음 "## [" 직전까지 추출 (literal 매칭).
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' "$CHANGELOG" > release-notes.md
          if ! grep -q "[^[:space:]]" release-notes.md; then
            echo "::error::CHANGELOG 에서 [$VER] 섹션을 찾지 못했습니다: $CHANGELOG"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SUB: ${{ steps.meta.outputs.sub }}
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          gh release create "$TAG" \
            --title "알콜미터 $SUB $VER" \
            --notes-file release-notes.md \
            --verify-tag
