<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="알콜미터 - 전통주 양조를 위한 정밀 배합 계산기. 쌀의 양만 입력하면 단양주, 이양주, 삼양주의 최적 배합 비율을 자동으로 계산합니다." />
		<meta name="keywords" content="막걸리, 전통주, 양조, 계산기, 배합, 누룩, 밑술, 덧술, 단양주, 이양주, 삼양주" />
		<meta name="author" content="알콜미터" />
		<meta name="theme-color" content="#f2f4f7" />

		<!-- Theme: apply saved preference before paint (no FOUC). Key shared with src/lib/theme.ts -->
		<script>
			(function () {
				try {
					var m = localStorage.getItem('alcolmeter-theme');
					if (m === 'light' || m === 'dark') {
						document.documentElement.dataset.theme = m;
					}
					var dark =
						m === 'dark' ||
						(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta && dark) meta.setAttribute('content', '#0b0e15');
				} catch (e) {}
			})();
		</script>

		<title>알콜미터 - 전통주 양조 계산기</title>

		<!-- Google Search Console -->
		<meta name="google-site-verification" content="z6gFkUDWNhYH-26W8Md0P-bbGVVedLHDjug_Lm4mm6g" />

		<!-- Naver Search Advisor -->
		<meta name="naver-site-verification" content="564b921e858249db9fcad242f1ce69ca336fc3ef" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="알콜미터 - 전통주 양조 계산기" />
		<meta property="og:description" content="전통주 양조를 위한 정밀 배합 계산기. 쌀의 양만 입력하면 최적의 비율을 알려드립니다." />
		<meta property="og:url" content="https://alcolmeter.kr" />
		<meta property="og:image" content="https://alcolmeter.kr/og-image.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="알콜미터 - 전통주 양조 계산기" />
		<meta name="twitter:description" content="전통주 양조를 위한 정밀 배합 계산기. 쌀의 양만 입력하면 최적의 비율을 알려드립니다." />

		<!-- Google Analytics -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-676TH48X9B"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-676TH48X9B');
		</script>

		<!-- 파비콘 link는 캐시 버스팅 쿼리(?v=해시)를 위해 +layout.svelte의 <svelte:head>에서 주입한다 -->
		<!-- Design system fonts: Geist/Geist Mono (Latin), Cabinet Grotesk (display), Pretendard (Korean) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
